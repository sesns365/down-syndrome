<title>一個詞的重量 低年級版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Bpmf+Iansui&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: header with version switch, sticky step rail, one panel per lesson step; projector-sized type. Storybook treatment: paper-textured ground, serif display, soft watercolor accents. */
:root{
  --bg:#f6efe0; --paper:#fffaf0; --tex:url("paper_tile.jpg"); --ink:#132a5c; --muted:#5d6782; --line:#e6dfd0;
  --blue:#132a5c; --blue-soft:#e4eef6; --sun:#f8c873; --sun-soft:#fdeccb;
  --sky:#74c6e4; --coral:#f39a8b; --mint:#7fc395;
  --good:#2f9a5e; --warn:#d99000; --bad:#d9463b;
  --board:#2f5d4a; --wall:#f3eee2; --floor:#e2d6c2; --skin:#f6d7b8;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --tex:none; --paper:#182131; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2b374b;
  --blue:#6fa2f0; --blue-soft:#1d2d47; --sun:#f6c445; --sun-soft:#3a3018;
  --good:#4cc38a; --warn:#f0a43c; --bad:#ef6b6b;
  --board:#24493a; --wall:#1c2638; --floor:#3a3428; --skin:#e8c4a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --tex:none; --paper:#182131; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2b374b;
  --blue:#6fa2f0; --blue-soft:#1d2d47; --sun:#f6c445; --sun-soft:#3a3018;
  --good:#4cc38a; --warn:#f0a43c; --bad:#ef6b6b;
  --board:#24493a; --wall:#1c2638; --floor:#3a3428; --skin:#e8c4a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg) var(--tex) repeat;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:900;text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.opt:disabled{opacity:1}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header.top{padding-block:24px 14px}
.brand{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand .id{display:flex;gap:16px;align-items:center;min-width:0}
.brand h1{font-size:clamp(2rem,5vw,3rem)}
.brand .sub{color:var(--muted);font-size:.98rem}
.seg{display:flex;border:1.5px solid var(--blue);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--blue);padding:8px 14px;font-weight:700;display:grid;line-height:1.3;text-align:left}
.seg button small{font-weight:400;font-size:.8rem;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.tabrow a{flex:none;text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:999px;font-weight:500;font-size:.95rem;white-space:nowrap}
.tabrow a .n{font-family:var(--display);color:var(--blue);margin-right:4px}
.tabrow a .m{font-size:.78rem;opacity:.8;margin-left:4px}
.tabrow a[aria-current="page"]{background:var(--blue);color:var(--paper)}
.tabrow a[aria-current="page"] .n{color:var(--sun)}

main{padding-block:26px 64px}
section.panel{display:grid;gap:22px}
.lead{font-size:1.1rem;color:var(--muted);max-width:62ch}
.step{display:inline-block;font-size:.85rem;letter-spacing:.1em;color:var(--blue);font-weight:700;margin-bottom:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--blue);color:var(--paper);font-weight:700;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.sun{background:var(--sun);color:#2a1e00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.teacher{border-left:4px solid var(--sun);background:var(--sun-soft);padding:12px 16px;border-radius:0 10px 10px 0;font-size:.98rem;display:grid;gap:6px}
.lv{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:6px;margin-right:6px;background:var(--blue-soft);color:var(--blue)}
.lv.hi{background:var(--blue);color:var(--paper)}
.muted{color:var(--muted)}
.ver{font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:2px 10px;justify-self:start}

/* poll */
.poll{display:grid;gap:12px}
.poll .q{font-family:var(--display);font-size:1.35rem}
.bar{height:14px;background:var(--blue-soft);border-radius:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}
.counter{display:flex;align-items:center;gap:10px}
.counter output{font-size:2rem;font-family:var(--display);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.counter button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:var(--blue-soft);color:var(--ink);border-radius:999px;padding:6px 14px}
input[type=text],input[type=number],textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
input[type=text],textarea{width:100%}
textarea{min-height:84px;resize:vertical}
.reveal{display:grid;gap:10px;background:var(--blue);color:var(--paper);border-radius:14px;padding:22px}
.reveal h3{font-size:1.6rem}
.reveal p{color:var(--paper);opacity:.92}

/* stage (drama) */
.stage{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.cap{padding:14px 18px;font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.6rem);min-height:3.6em;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.cap .sn{font-family:var(--body);font-size:.8rem;color:var(--blue);font-weight:700;padding-top:.5em;flex:none}
.ch{transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .6s}
.ch .hd{fill:var(--skin);stroke:var(--ink);stroke-width:2}
.ch .eye{fill:var(--ink)}
.ch .mo{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.ch .tr{fill:var(--blue);opacity:0;transition:opacity .4s}
.ch.cry .tr{opacity:1}
.ch .nm{fill:var(--ink);font-family:var(--body);font-size:14px;font-weight:700}
.ch.spot .hd{stroke:var(--sun);stroke-width:4}
.bob{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bub rect{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.bub text{fill:var(--ink);font-family:var(--display);font-size:19px}
.bub.hurt rect{stroke:var(--bad);stroke-width:3}
.bub.kind rect{stroke:var(--good);stroke-width:3}
.bub{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-size:.8rem;padding:0}
.dots button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:var(--paper)}

/* chromosome */
.svgbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;min-width:300px}
.chr{fill:var(--blue)} .chr-other{fill:var(--muted);opacity:.55} .chr-extra{fill:var(--sun)}
.lbl{fill:var(--ink);font-family:var(--body);font-size:15px}
.lbl-s{fill:var(--muted);font-family:var(--body);font-size:12px}
.play .drop{animation:drop 1.4s cubic-bezier(.3,1.4,.5,1) .4s both}
.play .glow{animation:glow 1.6s ease-in-out 1.8s 2 both}
.play .tag{animation:fadein .6s ease 1.8s both}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.45}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.fact .k{font-family:var(--display);font-size:1.7rem;color:var(--blue);min-width:3.5ch;line-height:1.1}
.can{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.can div{background:var(--sun-soft);border-radius:10px;padding:12px;text-align:center;font-weight:500;display:grid;gap:6px;justify-items:center}
.can svg{width:40px;height:40px}
.can svg *{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.canplay div{animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}

/* nickname */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.side{border-radius:14px;padding:18px;display:grid;gap:10px;border:2px solid}
.side.warm{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--paper))}
.side.cold{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--paper))}
.side .tag2{font-weight:700;font-size:.9rem}
.side.warm .tag2{color:var(--good)} .side.cold .tag2{color:var(--bad)}
.side ul{margin:0;padding-left:1.2em}
.judge{display:grid;gap:12px}
.jline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.jline .s{font-family:var(--display);font-size:1.2rem}
.jline .b{display:flex;gap:6px}
.jline .b button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px}
.jline .fb{grid-column:1/-1;font-size:.95rem;color:var(--muted)}
.jline.ok{border-color:var(--good)} .jline.no{border-color:var(--warn)}
@media (max-width:560px){.jline{grid-template-columns:1fr}}

/* challenge & quiz */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.team{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;text-align:center}
.team .nm{font-weight:700}
.team .pt{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
.team .ctl{display:flex;justify-content:center;gap:6px}
.team .ctl button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:2px 12px}
.qcard{display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(1.4rem,3vw,2rem)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:1.08rem;display:flex;gap:10px}
.opt .l{font-family:var(--display);color:var(--blue);font-weight:700}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.explain{border-radius:12px;padding:14px 16px;background:var(--blue-soft)}
.qprog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.qprog span{display:block;height:100%;background:var(--sun);transition:width .3s}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result .big{font-family:var(--display);font-size:4rem;color:var(--blue);line-height:1}

/* ripple */
.ripple-stage .ring{fill:none;stroke:var(--bad);stroke-width:3;opacity:0}
.ripple-stage.go .ring{animation:ring 2.4s ease-out infinite}
.ripple-stage.go .ring:nth-of-type(2){animation-delay:.8s}
.ripple-stage.go .ring:nth-of-type(3){animation-delay:1.6s}
.ripple-stage.kind .ring{stroke:var(--good)}
@keyframes ring{0%{r:30;opacity:.8}100%{r:230;opacity:0}}
.face{fill:var(--sun-soft);stroke:var(--ink);stroke-width:2}
.mouth{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.tear{fill:var(--blue);opacity:0;transition:opacity .5s}
.sad .tear{opacity:1}
.bubble{fill:var(--paper);stroke:var(--bad);stroke-width:2.5}
.kind .bubble{stroke:var(--good)}
.btxt{fill:var(--ink);font-family:var(--display);font-size:20px}

/* sort */
.scen{display:grid;gap:14px}
.scen .say{font-family:var(--display);font-size:clamp(1.3rem,2.8vw,1.8rem);background:var(--sun-soft);padding:16px 18px;border-radius:12px}
.votes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vote{border-radius:14px;padding:18px 8px;justify-items:center;text-align:center;border:1.5px solid var(--line);background:var(--paper);display:grid;gap:6px}
.vote .t{font-weight:700}
.vote.ok .t{color:var(--good)} .vote.mid .t{color:var(--warn)} .vote.hurt .t{color:var(--bad)}
.vote .ctl{display:flex;justify-content:center;gap:6px}
.vote .ctl button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;width:36px;height:36px}
.vote output{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.vbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.vbar span{display:block;height:100%;width:0;transition:width .3s}
.ok .vbar span{background:var(--good)} .mid .vbar span{background:var(--warn)} .hurt .vbar span{background:var(--bad)}

/* traffic light */
.light{width:34px;height:78px;margin:0 auto;border:2.5px solid var(--ink);border-radius:10px;display:grid;grid-template-rows:repeat(3,1fr);gap:3px;padding:4px;background:var(--paper)}
.light i{display:block;border-radius:50%;border:2px solid var(--ink);opacity:.9}
.ok .light i:nth-child(3){background:var(--good)}
.mid .light i:nth-child(2){background:var(--sun)}
.hurt .light i:nth-child(1){background:var(--bad)}
.scen .whoq{justify-self:end;background:var(--ink);color:var(--paper);padding:4px 12px;font-weight:700;border-radius:4px}

/* promise */
.slogan{text-align:center;font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.4;padding-block:18px;position:relative}
.slogan small{display:block;font-size:.5em;font-weight:500;color:var(--muted)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.flip{border:0;border-radius:14px;padding:18px 16px;min-height:120px;text-align:left;display:grid;gap:6px;align-content:center;background:var(--coral);color:var(--ink)}
.flip .lab{font-size:.8rem;font-weight:700;opacity:.8}
.flip .w{font-size:1.4rem;font-weight:900}
.flip.on{background:var(--mint)}
.vows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.vow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px}
.vow b{font-size:1.5rem;font-weight:900}
.vow:nth-child(4) b{color:var(--coral)} .vow:nth-child(1) b{color:var(--sky)} .vow:nth-child(2) b{color:var(--warn)} .vow:nth-child(3) b{color:var(--good)}
.mascot{flex:none}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}


/* answer feedback */
.fxlayer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;width:10px;height:14px;border-radius:2px;animation:cf 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.stamp{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:3.2rem;line-height:1;animation:stamp .9s ease-out forwards}
.stamp.g{color:var(--good)} .stamp.b{color:var(--bad)}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}60%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.shake{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.sound{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
/* film player */
.film{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fv{aspect-ratio:16/9;max-width:100%;background:var(--bg)}
.fv svg{width:100%;height:100%}
.fbar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.fbar input{flex:1;min-width:0;accent-color:var(--blue)}
.vsel{font:inherit;font-size:.85rem;padding:4px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);max-width:11em}
.film:fullscreen{display:grid;grid-template-rows:1fr auto;background:#000;border-radius:0}
.film:fullscreen .fv{aspect-ratio:auto;width:100%;height:100%;max-height:calc(100vh - 70px)}
.film:fullscreen .fv svg{height:100%}
.fs{padding:6px 12px;font-size:.9rem}
.ftime{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.vote{font:inherit;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s}
.vote:hover{transform:translateY(-2px)}
.vote.ok:hover{border-color:var(--good)} .vote.mid:hover{border-color:var(--warn)} .vote.hurt:hover{border-color:var(--bad)}
.vote .light{width:46px;height:104px}
.vote output{font-size:2.4rem}
.vote.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.06)}}
[hidden]{display:none!important}
.vote .vbar{width:100%}
.sortnav{display:grid;grid-template-columns:auto 1fr auto;gap:10px}
.sortnav #op{justify-self:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.9rem}
.qslide{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(28px,6vw,64px) clamp(18px,4vw,48px);min-height:min(60vh,460px);display:grid;align-content:center;justify-items:center;text-align:center;gap:18px}
.qslide.rev{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.qk{font-weight:700;letter-spacing:.12em;color:var(--blue);font-size:1rem}
.qslide.rev .qk{color:var(--sun)}
.qbig{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,4.6vw,3.2rem);line-height:1.35;text-wrap:balance}
.qhint{color:var(--muted);font-size:1.1rem}
.qp{max-width:40ch;font-size:1.15rem;opacity:.95}
.qwords{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.qw{background:var(--sun-soft);border-radius:999px;padding:10px 22px;font-size:1.3rem;font-weight:700;animation:pop .35s ease-out both}
.qdots{display:flex;gap:8px;justify-content:center;align-items:center}
.qdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.qdots i.on{background:var(--blue);width:26px;border-radius:5px}

/* ===== 國小版：明亮童趣主題 =====
   Layout: sky-band header, sticker-like step chips (each step its own color), chunky toy buttons, big rounded cards. */
:root{
  --bg:#f2f8ff; --paper:#ffffff; --tex:none; --ink:#22314d; --muted:#5d6c84; --line:#d5e3f3;
  --blue:#2f7be8; --blue-soft:#e2efff; --sun:#ffc531; --sun-soft:#fff3cc;

  --sky:#5ccdf5; --coral:#ff958a; --mint:#6edca8; --grape:#b39cff;

.tabrow a:nth-child(6n+1){--c:var(--coral)} .tabrow a:nth-child(6n+2){--c:var(--sky)} .tabrow a:nth-child(6n+3){--c:var(--mint)}
.tabrow a:nth-child(6n+4){--c:var(--grape)} .tabrow a:nth-child(6n+5){--c:var(--warn)} .tabrow a:nth-child(6n+6){--c:var(--blue)}
.tabrow a[aria-current="page"]{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff}
.tabrow a[aria-current="page"] .n{background:#fff;color:var(--c,var(--blue))}
.card,.qslide,.film,.svgbox,.chatwin{border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}

.sound{border:1.5px solid var(--line);box-shadow:none;background:var(--paper);color:var(--ink);border-radius:10px}
.navfoot{border-top:1px solid var(--line)}
.explain,.cres{background:var(--sun-soft);border:0;border-left:5px solid var(--sun);border-radius:10px;color:var(--ink)}
.reveal{background:var(--blue);color:#fff;border-radius:16px}
.reveal h3{color:#fff}
.side{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--good);border-radius:14px}
.side.cold{border-top-color:var(--bad)}
.tag2{font-weight:700;letter-spacing:.06em}
.jline{border:1px solid var(--line);border-radius:12px;background:var(--paper)}

.jline.no{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--paper))}

.jline .b button:hover{border-color:var(--ink)}
.scen .say{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--mark);font-family:var(--display);font-weight:400;color:var(--ink)}
.vote{border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
.vote.ok{background:var(--paper);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.vote.mid{background:var(--paper);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.vote.hurt{background:var(--paper);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

.ppv:hover{border-color:var(--blue)}

.opt:hover{border-color:var(--ink)}

.cno{background:var(--ink);color:#fff;border-radius:6px}
.slogan{color:var(--ink)}
.psegs button{border:1.5px solid var(--line);color:var(--muted)}
.psegs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fbar{border-top:1px solid var(--line);background:var(--paper)}
.qdots i.on{background:var(--blue)}
.linkbtn{color:var(--muted)}

<script>
/* [id, 名稱, 分鐘] */
const TABS=[["feel","心情溫度計",4,4],["story","小故事",7,7],["learn","認識唐氏症",7,7],["listen","聽了會不舒服嗎？",8,8],["sorry","說錯話怎麼辦",8,8],["vow","好好說小天使",6,6]];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mode="full";
let timers=[];
const clearTimers=()=>{timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[]};

function list(){return TABS.filter(t=>mode==="full"||t[3]>0)}
function current(){const h=location.hash.slice(1);const L=list();return L.some(t=>t[0]===h)?h:L[0][0]}
function nav(){
  const cur=current(),L=list();
  $("#tabrow").innerHTML=L.map(([id,n,f,s],i)=>{return `<a href="#${id}" ${id===cur?'aria-current="page"':''}><span class="n">${i+1}</span>${n}</a>`}).join("");
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  const a=document.querySelector('#tabrow [aria-current]'); if(a) a.scrollIntoView({block:"nearest",inline:"center"});
}
function foot(id){
  const L=list(),i=L.findIndex(t=>t[0]===id),p=L[i-1],n=L[i+1];
  return `<div class="navfoot">${p?`<a class="btn ghost" href="#${p[0]}">上一步：${p[1]}</a>`:'<span></span>'}${n?`<a class="btn" href="#${n[0]}">下一步：${n[1]}</a>`:''}</div>`;
}
function head(id,kicker,title){
  return `<h2>${title}</h2>`;
}
const T=()=>"";


/* ---------- 答題回饋：特效＋音效 ---------- */
const FX={on:store.get("snd",true),ctx:null,
 reduce:()=>matchMedia("(prefers-reduced-motion: reduce)").matches,
 tone(seq){if(!this.on)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=this.ctx;if(c.state==="suspended")c.resume();let t=c.currentTime+.01;
   seq.forEach(([f,d,type,v])=>{const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);t+=d*.62})}catch(e){}},
 layer(){let l=document.querySelector(".fxlayer");if(!l){l=document.createElement("div");l.className="fxlayer";document.body.appendChild(l)}return l},
 at(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};return [r.left+r.width/2,r.top+r.height/2]},
 stamp(el,txt,cls){const [x,y]=this.at(el),s=document.createElement("div");s.className="stamp "+cls;s.textContent=txt;s.style.left=x+"px";s.style.top=y+"px";this.layer().appendChild(s);setTimeout(()=>s.remove(),950)},
 good(el){this.tone([[784,.16],[988,.16],[1319,.4]]);if(el){el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}
   this.stamp(el,"○","g");if(this.reduce())return;
   const [x,y]=this.at(el),L=this.layer(),cols=["var(--coral)","var(--sky)","var(--mint)","var(--sun)"];
   for(let i=0;i<34;i++){const p=document.createElement("i");p.className="cf";const a=Math.random()*Math.PI*2,d=90+Math.random()*170;
     p.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%4]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+60}px;--r:${Math.random()*720-360}deg`;L.appendChild(p);setTimeout(()=>p.remove(),1150)}},
 bad(el){this.tone([[262,.2,"triangle",.25],[196,.34,"triangle",.25]]);this.stamp(el,"×","b");if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}},
 flip(){this.tone([[660,.1],[880,.18]])}
};
/* ---------- 動畫播放器：台灣語音（瀏覽器內建微軟語音），沒有時改用預錄配音 ---------- */
const AUDS=[];
const RECORDED={drama:1,know:1,sum:1,lodrama:1,loknow:1}; // 播放微軟台灣語音（曉臻、曉雨、雲哲）錄好的配音
const TW={list:[],ready:false};
function loadVoices(){try{const all=speechSynthesis.getVoices();TW.list=all.filter(v=>/zh[-_]TW/i.test(v.lang)||/Taiwan|臺灣|台灣|國語/.test(v.name));TW.ready=true}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
let VPICK=store.get("vpick","auto");
function twVoice(prefer){const L=TW.list;if(!L.length)return null;
  if(VPICK!=="auto"){const c=L.find(v=>v.name===VPICK);if(c)return c}
  const score=v=>(prefer.some(p=>v.name.includes(p))?20-prefer.findIndex(p=>v.name.includes(p)):0)+(/Natural|Online/i.test(v.name)&&/Microsoft/i.test(v.name)?10:0)+(/Google/i.test(v.name)?4:0)+(/Microsoft/i.test(v.name)?2:0);
  return L.slice().sort((x,y)=>score(y)-score(x))[0]}

function filmBlock(id){return `<div class="film" id="film-${id}"><div class="fv"></div><img class="fv-logo" src="${SE365}" alt=""><div class="fbar"><button class="btn" type="button">播放</button><input type="range" min="0" max="1000" value="0" aria-label="播放進度"><span class="ftime"></span><select class="vsel" aria-label="配音聲音"></select><button class="btn ghost fs" type="button">全螢幕</button></div></div>`}
function fillVoiceSel(sel){loadVoices();const L=TW.list;
  if(!L.length){sel.hidden=true;return}sel.hidden=false;
  const nm=v=>v.name.replace(/ - Chinese.*$/,"").replace(/\s*\(Natural\)/,"").replace(/^Microsoft /,"微軟 ").replace(/ Online/,"");
  sel.innerHTML=`<option value="auto">聲音：自動</option>`+L.map(v=>`<option value="${esc(v.name)}" ${v.name===VPICK?"selected":""}>${esc(nm(v))}</option>`).join("");
  sel.onchange=()=>{VPICK=sel.value;store.set("vpick",VPICK);document.querySelectorAll(".vsel").forEach(o=>o.value=VPICK)}}
function mountFilm(id){
  const K=window.FILMKIT;if(!K)return;const f=K.FILMS[id];
  const root=$("#film-"+id),v=root.querySelector(".fv"),btn=root.querySelector("button"),seek=root.querySelector("input"),tm=root.querySelector(".ftime");
  const fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,"0")}`;
  const draw=t=>{v.innerHTML=K.frame(f,Math.min(t,f.total-.01));seek.value=Math.round(t/f.total*1000);tm.textContent=fmt(t)+" / "+fmt(f.total)};
  const useTTS=()=>{if(RECORDED[id])return false;loadVoices();return TW.list.length>0&&"speechSynthesis" in window};
  /* 預錄配音（沒有台灣語音時） */
  let au=null;
  /* 台灣語音 */
  let T=0,playing=false,last=0,segs=[],cur=-1,speaking=false,raf=0;
  const prep=()=>{const est=JSON.parse(JSON.stringify(window.FILM_TIMING));est[id]=est[id].map(r=>r.map(d=>d*.9));K.build(f,est);
    segs=[];f.tl.forEach(s=>s.segs.forEach(g=>segs.push({a:s.start+g.start,b:s.start+g.end,who:g.who,text:g.text})))};
  const speak=sg=>{try{speechSynthesis.cancel()}catch(e){}const r=ROLE[sg.who]||ROLE.n,u=new SpeechSynthesisUtterance(K.say(sg.text));
    const vo=twVoice(r.p);if(vo){u.voice=vo;u.lang=vo.lang}else u.lang="zh-TW";u.pitch=r.pitch;u.rate=r.rate;speaking=true;
    u.onend=u.onerror=()=>{if(u===speak.u)speaking=false};speak.u=u;speechSynthesis.speak(u)};
  const tick=now=>{if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;
    const k=segs.findIndex(sg=>T>=sg.a&&T<sg.b+.05);
    if(k>=0&&k!==cur){cur=k;speak(segs[k])}
    if(speaking&&cur>=0&&T>=segs[cur].b-.03)T=segs[cur].b-.03; else T+=dt;
    if(T>=f.total){stopTTS();btn.textContent="重播";draw(f.total);return}
    draw(T);raf=requestAnimationFrame(tick)};
  const stopTTS=()=>{playing=false;cancelAnimationFrame(raf);try{speechSynthesis.cancel()}catch(e){}speaking=false;cur=-1};
  const ctl={pause:()=>{if(au)au.pause();stopTTS()}};AUDS.push(ctl);
  btn.onclick=()=>{
    if(useTTS()){
      if(playing){stopTTS();btn.textContent="播放";return}
      if(!segs.length)prep();if(T>=f.total-.1)T=0;cur=-1;playing=true;btn.textContent="暫停";last=performance.now();raf=requestAnimationFrame(tick);
    }else{
      if(!au){K.build(f,window.FILM_TIMING);au=new Audio("nar_"+id+".mp3");
        const loop=()=>{draw(au.currentTime);if(!au.paused)requestAnimationFrame(loop)};au.onplay=loop;au.onended=()=>{btn.textContent="重播";draw(f.total)}}
      if(au.paused){if(au.currentTime>=f.total-.1)au.currentTime=0;au.play().catch(()=>{});btn.textContent="暫停"}else{au.pause();btn.textContent="播放"}
    }};
  seek.oninput=()=>{const t=seek.value/1000*f.total;if(au&&!useTTS()){au.currentTime=t;draw(t);return}
    if(!segs.length)prep();const was=playing;stopTTS();T=t;draw(T);if(was){playing=true;last=performance.now();raf=requestAnimationFrame(tick)}};
  root.querySelector(".fs").onclick=()=>{const el=root;try{if(document.fullscreenElement===el){document.exitFullscreen()}else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}}catch(e){}};
  {const wake=()=>{root.classList.add("ui");clearTimeout(root._ut);root._ut=setTimeout(()=>root.classList.remove("ui"),2500)};["mousemove","touchstart","keydown"].forEach(ev=>root.addEventListener(ev,wake,{passive:true}));document.addEventListener("fullscreenchange",()=>{if(document.fullscreenElement===root)wake();root.querySelector(".fs").textContent=document.fullscreenElement===root?"離開全螢幕":"全螢幕"})}
  const vs=root.querySelector(".vsel");fillVoiceSel(vs);if(RECORDED[id])vs.hidden=true;try{speechSynthesis.addEventListener("voiceschanged",()=>{fillVoiceSel(vs);if(RECORDED[id])vs.hidden=true})}catch(e){}
  if(useTTS())prep();else K.build(f,window.FILM_TIMING);
  draw(1.6);seek.value=0;T=0;
}

function faceSVG(k){const mouth=k==="happy"?'<path d="M-26 14 q26 26 52 0" stroke="#1b2540" stroke-width="7" fill="none" stroke-linecap="round"/>':k==="ok"?'<path d="M-24 22h48" stroke="#1b2540" stroke-width="7" stroke-linecap="round"/>':'<path d="M-26 30 q26 -24 52 0" stroke="#1b2540" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M-36 -30l20 9M36 -30l-20 9" stroke="#1b2540" stroke-width="6" stroke-linecap="round"/>';
  const col={happy:"#7fd1a3",ok:"#ffd666",sad:"#ff9b8a"}[k];
  return `<svg viewBox="-70 -70 140 140" aria-hidden="true"><circle r="64" fill="${col}" stroke="#1b2540" stroke-width="5"/><circle cx="-22" cy="-8" r="8" fill="#1b2540"/><circle cx="22" cy="-8" r="8" fill="#1b2540"/>${mouth}</svg>`}
/* 朗讀：瀏覽器內建台灣語音 */
function readAloud(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,"").replace(/[「」]/g,"").replace(/[\u{E0100}-\u{E01EF}]/gu,""));const v=twVoice(["HsiaoChen","HsiaoYu"]);if(v){u.voice=v;u.lang=v.lang}else u.lang="zh-TW";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const SPK=t=>`<button type="button" class="spk" data-say="${esc(t.replace(/<[^>]+>/g,""))}" aria-label="念給我聽">🔊 念給我聽</button>`;
function bindSpk(){document.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();readAloud(b.dataset.say)})}
function faceVotes(key,idx,n=3){const all=store.get(key,{}),v=all[idx]||[0,0,0];
  return `<div class="fvotes">${FACES.map(([k,t],j)=>`<button type="button" class="fvote ${k}" data-fv="${j}" aria-label="${t}，目前 ${v[j]} 票，點一下加一票">${faceSVG(k)}<span class="t">${t}</span><output>${v[j]}</output></button>`).join("")}</div>`}
function bindFace(key,idx,redraw){document.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{const all=store.get(key,{});const v=all[idx]||[0,0,0];v[+b.dataset.fv]++;all[idx]=v;store.set(key,all);FX.tone([[600-+b.dataset.fv*90,.12]]);redraw();const el=document.querySelector(`[data-fv="${b.dataset.fv}"]`);if(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}})}

/* ---------- 1 心情溫度計 ---------- */
const FEELQ="如果有人對你說<br>「你很唐欸！」<br>你的心情是？";
function renderFeel(){
  const Q=[
   {k:"上課前",q:FEELQ,vote:"pre"},
   {k:"想一想",q:"你有聽過別人說<br>「很唐」「唐寶」嗎？",hint:"有聽過的小朋友，請舉手"},
   {k:"今天要學",q:"「唐」說的是<br>「唐氏症」的小朋友",reveal:1,p:"他們是真實的人，有名字、有家人，<br>被笑的時候，也會難過。"}];
  let i=0;
  const draw=()=>{const c=Q[i];
    $("#main").innerHTML=`<section class="panel lo">
     <div class="qslide ${c.reveal?"rev":""}">
       <span class="qk">${c.k}</span>
       <div class="qbig zy">${c.q}</div>${SPK(c.q)}
       ${c.hint?`<p class="qhint zy">${c.hint}</p>`:""}${c.p?`<p class="qp zy">${c.p}</p>`:""}
       ${c.vote?faceVotes("feel",c.vote):""}
     </div>
     <div class="sortnav"><button class="btn ghost" id="qp" type="button" ${i===0?"disabled":""}>上一步</button>
       <div class="qdots">${Q.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
       <button class="btn" id="qn" type="button">${i===Q.length-1?"下一步：小故事":"下一頁"}</button></div></section>`;
    $("#qn").onclick=()=>{if(i<Q.length-1){i++;draw();if(Q[i].reveal)FX.good(document.querySelector(".qk"))}else location.hash="story"};
    $("#qp").onclick=()=>{if(i>0){i--;draw()}};
    if(c.vote)bindFace("feel",c.vote,draw);bindSpk()};
  draw();
}

/* ---------- 4 聽了會不舒服嗎？ ---------- */
const LS=[
 {s:"「你畫得󠇡好漂亮！」",a:0,f:"被稱讚，心裡會開心。"},
 {s:"「你今天穿藍色的衣服。」",a:1,f:"只是說出看到的事，大部分󠇡的人會覺得󠇡還好。"},
 {s:"「你很唐欸！」",a:2,f:"用「唐」笑別人，被笑的人會難過；唐氏症的小朋友跟家人聽到，也會難過。"},
 {s:"「慢慢來，我等你。」",a:0,f:"有人願意等我，心裡暖暖的。"},
 {s:"「唐寶！快一點啦！」",a:2,f:"大聲笑別人慢，會讓人覺得󠇡丟臉、難過。"},

function renderListen(){
  const st=store.get("lis",{i:0,open:false});

     <div class="card scen">
       <div class="row" style="justify-content:space-between"><span class="step">第 ${st.i+1} 句／共 ${LS.length} 句</span><button class="linkbtn" id="rs" type="button">重設票數</button></div>
       <p class="zy lq">如果有人這樣跟你說，你會覺得󠇡？</p>
       <div class="say zy">${c.s}${SPK(c.s)}</div>
       ${faceVotes("lisv",st.i)}
       ${st.open?`<div class="explain zy"><b>${FACES[c.a][1]}：</b>${c.f}${okHurt?`<br><span class="okq">選「還好」的小朋友，想一想：如果是小宇聽到，他會怎麼樣？</span>`:""}</div>`:""}
       <div class="sortnav"><button class="btn ghost" id="pv" type="button" ${st.i===0?"disabled":""}>上一句</button>
         <button class="btn sun" id="op" type="button">${st.open?"收起":"大家來想想"}</button>
         <button class="btn" id="nx" type="button" ${st.i===LS.length-1?"disabled":""}>下一句</button></div>
     </div>
     ${foot("listen")}</section>`;
    bindFace("lisv",st.i,draw);bindSpk();
    $("#rs").onclick=()=>{const a=store.get("lisv",{});a[st.i]=[0,0,0];store.set("lisv",a);draw()};
    $("#op").onclick=()=>{st.open=!st.open;store.set("lis",st);draw();if(st.open)FX.flip()};
    $("#pv").onclick=()=>{st.i--;st.open=false;store.set("lis",st);draw()};
    $("#nx").onclick=()=>{st.i++;st.open=false;store.set("lis",st);draw()}};
  draw();
}

const STEP3=[["✋","停下來","發現說錯話，先停下來。"],["🙇","說對不起","看著對方，說：對不起。"],["💬","換句話說","換一句讓人舒服的話。"]];

/* ---------- 6 好好說小天使 ---------- */
function CERTLO(cls){
  const N="#23406e",K="'Bpmf Iansui','Iansui','Noto Sans TC',sans-serif",B="'Noto Sans TC',sans-serif";
  const d=new Date(),date=`中華民國 ${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const name=(cls||"").trim()?esc(cls.trim()):"＿＿＿＿＿＿";
  const V=[["我不說","「很唐」「唐寶」","#ff8a7a","#fff0ed"],["說錯話","我會說對不起","#f5a623","#fff6dc"],["我會叫","同學的名字","#2fb58c","#e6f8f1"]];
  const star=(x,y,r,c)=>{let p="";for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;p+=`${(x+rr*Math.cos(a)).toFixed(1)},${(y+rr*Math.sin(a)).toFixed(1)} `}return `<polygon points="${p}" fill="${c}"/>`};
  const wing=(x,s)=>`<path transform="translate(${x} 150) scale(${s} 1)" d="M0 0 C40 -40 90 -30 100 10 C70 0 60 20 40 20 C60 30 50 50 20 40 C30 55 10 60 0 40z" fill="#fff" stroke="${N}" stroke-width="3"/>`;
  const box=(v,i)=>{const x=95+i*320,y=280;return `<g><rect x="${x}" y="${y}" width="292" height="190" rx="28" fill="${v[3]}" stroke="${v[2]}" stroke-width="4"/>${star(x+146,y+48,26,v[2])}
    <text x="${x+146}" y="${y+118}" text-anchor="middle" font-size="36" fill="${N}" font-family="${K}">${v[0]}</text>
    <text x="${x+146}" y="${y+164}" text-anchor="middle" font-size="26" fill="${N}" font-family="${K}">${v[1]}</text></g>`};
  let hands="";for(let r=0;r<2;r++)for(let c=0;c<13;c++){const x=96+c*72,y=560+r*84;hands+=`<rect x="${x}" y="${y}" width="62" height="74" rx="14" fill="#fff" stroke="${N}" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 4"/>`}
  return `<svg class="cert" viewBox="0 0 1123 794" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${name} 好好說小天使宣言">
   <defs><linearGradient id="clg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf6ff"/><stop offset="1" stop-color="#fff4e2"/></linearGradient></defs>
   <rect width="1123" height="794" fill="url(#clg)"/>
   <rect x="18" y="18" width="1087" height="758" rx="34" fill="none" stroke="${N}" stroke-width="6"/>
   <rect x="34" y="34" width="1055" height="726" rx="24" fill="none" stroke="#ffc94d" stroke-width="3" stroke-dasharray="14 10"/>
   ${star(150,90,16,"#ffc94d")}${star(980,90,16,"#6aa8ff")}${star(250,230,10,"#ff8a7a")}${star(880,230,10,"#5cc9a7")}
   <text x="561.5" y="150" text-anchor="middle" font-size="68" fill="${N}" font-family="${K}">好好說小天使</text>
   <text x="561.5" y="225" text-anchor="middle" font-size="30" fill="${N}" font-family="${K}"><tspan fill="#e8604c">${name}</tspan>　我們一起約定：</text>
   ${V.map(box).join("")}
   <text x="96" y="545" font-size="20" fill="${N}" font-weight="700" font-family="${B}">全班按手印或簽名</text>
   <text x="1027" y="545" text-anchor="end" font-size="18" fill="${N}" font-family="${B}">${date}</text>
   ${hands}
   <g class="seal" transform="translate(1000 160)"><g class="sealin"><circle r="58" fill="#ffc94d" stroke="#e0a52a" stroke-width="3"/><circle r="46" fill="#fff6dc" stroke="#e0a52a" stroke-width="2"/>
     <text y="-4" text-anchor="middle" font-size="26" fill="#c0492f" font-family="${K}">做得</text><text y="28" text-anchor="middle" font-size="26" fill="#c0492f" font-family="${K}">到！</text></g></g>
  </svg>`;
}
function renderVow(){
  $("#main").innerHTML=`<section class="panel lo">
   <div class="ptitle">${head("vow","","好好說小天使")}<div class="psegs" role="tablist"><button type="button" role="tab" data-pt="0">① 下課前再投一次</button><button type="button" role="tab" data-pt="1">② 小天使宣言</button></div></div>
   <div class="ptab" data-p="0"><div class="qslide"><span class="qk">下課前</span><div class="qbig zy">${FEELQ}</div>${SPK(FEELQ)}${faceVotes("feel","post")}
     <div id="feelcmp"></div></div></div>
   <div class="ptab" data-p="1"><div class="card certcard"><div class="certduo"><div class="certwrap" id="certwrap">${CERTLO(store.get("certCls",""))}</div>
     <div class="certctl"><label for="cls" class="muted">班級</label><input id="cls" type="text" placeholder="例如：二年一班" value="${esc(store.get("certCls",""))}">
       <button class="btn sun" id="vowgo" type="button">我們做得到！</button><button class="btn ghost" id="certfs" type="button">全螢幕展示</button><button class="btn ghost" id="certpr" type="button">列印／存成 PDF</button></div></div></div></div>
   ${foot("vow")}</section>`;
  const cmp=()=>{const f=store.get("feel",{}),a=f.pre||[0,0,0],b=f.post||[0,0,0],sa=a[0]+a[1]+a[2],sb=b[0]+b[1]+b[2];
    $("#feelcmp").innerHTML=sa&&sb?`<div class="ppcmp"><h4>上課前、下課前，選「不舒服」的有幾位？</h4><p class="zy" style="font-size:1.3rem;margin:4px 0 0">上課前 <b>${a[2]}</b> 位 → 下課前 <b>${b[2]}</b> 位</p></div>`:""};
  const redrawVote=()=>{const q=document.querySelector('.ptab[data-p="0"] .fvotes');q.outerHTML=faceVotes("feel","post");bindFace("feel","post",redrawVote);cmp()};
  bindFace("feel","post",redrawVote);cmp();bindSpk();
  const ptab=k=>{store.set("lotab",k);document.querySelectorAll(".ptab").forEach(d=>d.hidden=+d.dataset.p!==k);document.querySelectorAll("[data-pt]").forEach(b=>b.setAttribute("aria-selected",+b.dataset.pt===k))};
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>ptab(+b.dataset.pt));ptab(store.get("lotab",0));
  const cls=$("#cls"),wrap=$("#certwrap");
  cls.oninput=()=>{store.set("certCls",cls.value);wrap.innerHTML=CERTLO(cls.value)};
  $("#vowgo").onclick=()=>{const g=wrap.querySelector(".sealin");FX.good($("#vowgo"));if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const t0=performance.now();
    const f=t=>{let k=Math.min(1,(t-t0)/600);const e=1-Math.pow(1-k,3);g.setAttribute("transform",`scale(${(2.6-1.6*e).toFixed(3)}) rotate(${(-40*(1-e)).toFixed(1)})`);g.setAttribute("opacity",Math.min(1,k*1.7).toFixed(2));if(k<1)requestAnimationFrame(f);else{g.removeAttribute("transform");g.removeAttribute("opacity")}};requestAnimationFrame(f)};
  $("#certfs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():wrap.requestFullscreen&&wrap.requestFullscreen()};
  $("#certpr").onclick=()=>window.print();
}
